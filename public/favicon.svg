<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Licol">
  <title>Licol</title>
  <!--
    Version réduite : sans étampures, et avec un fer un peu plus épais.
    À 16 ou 32 px, les six trous se referment en bouillie ; la silhouette
    seule reste nette.
